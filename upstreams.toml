# Forks kept in sync with upstream release tarballs.
#
# One table per fork. Every fork follows the same convention:
#   - upstream_branch (main): the pristine upstream tree, one commit per
#     imported release, tagged <tag_prefix>X.Y.Z (upstream/X.Y.Z);
#   - fork_branch (dev): our fork (build system, fixes, CI, site).
#
# Keys:
#   repo                  GitHub repository of the fork (owner/name)
#   upstream_branch       branch holding the pristine upstream tree
#   fork_branch           branch holding the fork
#   index_url             directory listing (HTML) where releases appear
#   download_url          base URL of tarballs and checksum file
#                         (default: index_url)
#   release_regex         file names that are releases; capture group 1 is
#                         the X.Y.Z version
#   release_file          tarball name for a version ({version} = X.Y.Z)
#   checksum_file         checksum list published next to the tarballs
#   checksum_algorithm    md5, sha1, sha256 or sha512
#   keep_paths            paths of the upstream branch that are ours and are
#                         carried over by every import (trailing / = folder)
#   export_paths          git pathspecs of upstream sources whose changes on
#                         the fork branch are "our fixes" (export command)
#   export_exclude        git glob pathspecs removed from export_paths
#   export_modified_only  list only modifications of files that exist
#                         upstream (not files we added or deleted)
#   fork_excluded_paths   upstream files the fork branch intentionally does
#                         not carry: merge-plan reports a "deleted by us"
#                         conflict on them as expected (keep the deletion),
#                         not as a real conflict
#   areas.build/src/docs  patterns grouping merge-plan conflicts; first
#                         match wins in the order build, src, docs; the rest
#                         is "other".
#
# Patterns (areas, fork_excluded_paths): "dir/" = everything below dir; a
# pattern containing "/" is a glob on the whole path; a pattern without "/"
# matches the file name at any depth; a leading "/" anchors at the root
# ("/configure" is only the top-level configure); "*", "?", "**" are globs.
#
# Only giac is synced. On the giac fork's dev branch, MicroPython
# (micropython/, replacing upstream's vendored micropython-1.12/) and the
# Xcas FLTK GUI (s-celles/xcas, extracted from the giac tarball) are git
# submodules: they are deliberately NOT synced with upstream (Giac.jl only
# needs libgiac), hence their upstream paths are in fork_excluded_paths.

[giac]
description = "Giac computer algebra system (Bernard Parisse)"
repo = "JuliaGiac/giac"
upstream_branch = "main"
fork_branch = "dev"
index_url = "https://www-fourier.univ-grenoble-alpes.fr/~parisse/giac/"
release_regex = '^giac-(\d+\.\d+\.\d+)\.tar\.gz$'
release_file = "giac-{version}.tar.gz"
checksum_file = "md5sum.txt"
checksum_algorithm = "md5"
# .github/ (Dependabot configuration of main) is ours, not upstream's.
keep_paths = [".github/"]
# Our fixes to upstream sources: the C++ sources (src/) and the reference
# outputs of the upstream test suite (check/). Not exported: the Meson build
# (meson.build files, meson_options.txt, cross/, subprojects/, scripts/),
# our own tests (tests/), docs and site (*.md, site/), CI (.github/), the
# Debian packaging (debian/) and the autotools/legacy files dev deletes
# (configure*, Makefile.*, m4/, config/, intl/, doc/*/Makefile.*).
export_paths = ["src/", "check/"]
export_exclude = ["**/meson.build"]
export_modified_only = true
# Upstream files dev removed on purpose (derived from everything dev deleted
# from the 2.0.0 tree; covers the 116 "deleted by us" conflicts of 2.1.0).
fork_excluded_paths = [
    # MicroPython: vendored upstream, a git submodule (micropython/) on dev
    "micropython-1.12/",
    # Xcas FLTK GUI: moved to s-celles/xcas (a submodule of dev)
    "src/Cfg.*", "src/Editeur.*", "src/Equation.*", "src/Fl_Gl_Choice.H",
    "src/Flv_*", "src/Flve_*", "src/Graph.*", "src/Graph3d.*", "src/Help1.*",
    "src/History.*", "src/Input.*", "src/Print.*", "src/Python.*",
    "src/Tableur.*", "src/Xcas1.*", "src/gl2ps.*", "src/hist.*",
    "src/xcas.cxx", "/xcas.*", "/xcas64.nsi", "/xcaswin.nsi",
    "/fltk-1.3.8-source.tar.bz2", "/fltk.1.1.changes", "/giac_fltk_changes",
    "debian/xcas.1",
    # Autotools build: replaced by Meson
    "Makefile.am", "Makefile.in", "/configure", "/configure.ac",
    "/configure.mingw", "/aclocal.m4", "/acinclude.m4", "/config.h.*",
    "/config.guess", "/config.sub", "/mkinstalldirs", "/path.h.in",
    "/ABOUT-NLS", "m4/", "config/", "intl/",
    # Legacy platform scripts and packaging: replaced by the justfile, cross/
    # files and the new debian/ packaging
    "/mk*", "/ckbuild*", "/build_for_iphoneos", "/compile.android",
    "/archive.mingw", "/build_tarballs.jl", "/changeversion", "/compte",
    "/inst", "/setup", "/win", "/win64", "/win2unix.cc", "/path.iphone",
    "/path.mingw", "/simupath.iphone", "/giac.specs*", "/Init.scm",
    "/addu.cc", "/pariinl.h", "debianold/", "debian/compat",
    "debian/giac.mime", "debian/giac.sharedmimeinfo", "debian/menu",
    "debian/pgiac.1",
    # Plain-text docs: converted to Markdown (README.md, AUTHORS.md, ...)
    "/README", "/README.MACOSX", "/README.hevea2mml", "/README.itex2MML",
    "/README.mingw", "/README.visualcpp", "/NEWS", "/INSTALL", "/INSTALACION",
    "/ChangeLog", "/AUTHORS", "/TODO", "/TROUBLES", "/LEAME.*", "/LISEZMOI.*",
    "/java.README", "src/README.*",
]

[giac.areas]
build = [
    "meson.build", "meson_options.txt", "meson.options", "justfile",
    "Makefile.am", "Makefile.in", "configure", "configure.*", "config.h*",
    "aclocal.m4", "acinclude.m4", "*.m4", "m4/", "config/", "cross/",
    "subprojects/", "scripts/", "debian/", "debianold/", "intl/", ".github/",
    ".gitignore", ".gitmodules",
]
src = ["src/"]
docs = [
    "doc/", "site/", "*.md", "README*", "NEWS", "ChangeLog", "AUTHORS",
    "INSTALL*", "INSTALACION", "LEAME*", "LISEZMOI*", "TODO", "TROUBLES",
    "*.html", "*.tex",
]
